<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente de la API de productos</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        body { background: #f5f7fb; }
        th[data-orden] { cursor: pointer; user-select: none; white-space: nowrap; }
        th[data-orden]:hover { color: #0d6efd; }
        #consola { background: #0f172a; color: #e2e8f0; font-size: .8rem; max-height: 340px; overflow: auto; border-radius: .5rem; }
        #consola .linea { border-bottom: 1px solid #1e293b; padding: .5rem .75rem; }
        #consola pre { color: #a5b4fc; margin: .25rem 0 0; white-space: pre-wrap; }
        .metodo { font-weight: 700; display: inline-block; min-width: 3.6rem; }
        .metodo-GET { color: #4ade80; } .metodo-POST { color: #facc15; } .metodo-PUT { color: #60a5fa; } .metodo-DELETE { color: #f87171; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand"><i class="bi bi-braces"></i> API de productos · cliente jQuery</span>
        <a class="btn btn-sm btn-outline-light" href="../README.md" target="_blank" rel="noopener"><i class="bi bi-book"></i> Documentación</a>
    </div>
</nav>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-xl-8">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-5">
                            <input type="search" class="form-control" id="q" placeholder="Buscar por nombre o SKU" aria-label="Buscar">
                        </div>
                        <div class="col-6 col-md-3">
                            <select class="form-select" id="categoria" aria-label="Categoría"><option value="">Todas las categorías</option></select>
                        </div>
                        <div class="col-6 col-md-2 d-flex align-items-center">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="sin-stock">
                                <label class="form-check-label small" for="sin-stock">Sin stock</label>
                            </div>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button class="btn btn-primary" id="btn-nuevo"><i class="bi bi-plus-lg"></i> Nuevo</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-2">
                            <thead>
                                <tr>
                                    <th data-orden="id">ID <i class="bi"></i></th>
                                    <th>SKU</th>
                                    <th data-orden="nombre">Nombre <i class="bi"></i></th>
                                    <th class="d-none d-md-table-cell">Categoría</th>
                                    <th data-orden="precio" class="text-end">Precio <i class="bi"></i></th>
                                    <th data-orden="stock" class="text-end">Stock <i class="bi"></i></th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="filas"></tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center small">
                        <span class="text-muted" id="resumen"></span>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" id="anterior" aria-label="Página anterior"><i class="bi bi-chevron-left"></i></button>
                            <button class="btn btn-outline-secondary" id="siguiente" aria-label="Página siguiente"><i class="bi bi-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body">
                    <label class="form-label small mb-1" for="clave">Clave de API (X-API-Key)</label>
                    <input class="form-control form-control-sm font-monospace" id="clave" value="demo-clave-portafolio">
                    <div class="form-text">Es la clave de demostración. Borrala para ver el error 401 al guardar.</div>
                </div>
            </div>
            <h2 class="h6 d-flex justify-content-between">Pedidos HTTP <button class="btn btn-link btn-sm p-0" id="limpiar">limpiar</button></h2>
            <div id="consola" aria-live="polite"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="form" novalidate>
            <div class="modal-header">
                <h2 class="modal-title h5" id="modal-titulo">Producto</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger d-none" id="form-error"></div>
                <div class="row g-3">
                    <div class="col-5">
                        <label class="form-label" for="f-sku">SKU</label>
                        <input class="form-control text-uppercase" id="f-sku" name="sku" placeholder="ALM-010" required>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-7">
                        <label class="form-label" for="f-categoria">Categoría</label>
                        <input class="form-control" id="f-categoria" name="categoria" list="lista-categorias" required>
                        <datalist id="lista-categorias"></datalist>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="f-nombre">Nombre</label>
                        <input class="form-control" id="f-nombre" name="nombre" required>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="f-precio">Precio</label>
                        <input class="form-control" id="f-precio" name="precio" type="number" step="0.01" min="0" required>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="f-stock">Stock</label>
                        <input class="form-control" id="f-stock" name="stock" type="number" step="1" min="0" value="0">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-12 form-check form-switch ms-2">
                        <input class="form-check-input" type="checkbox" id="f-activo" name="activo" checked>
                        <label class="form-check-label" for="f-activo">Activo</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/cliente.js"></script>
</body>
</html>
